<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Run Planner" />
    <!--
      Content Security Policy: only your own scripts plus Google's sign-in script may run, and the
      page may only talk to Google's APIs, the Strava API, and your own Cloudflare Worker (which
      holds the Strava client secret — see worker/). 'unsafe-inline' for styles is needed by FullCalendar.

      After deploying the worker (README, "Strava setup"), replace PASTE_YOUR_WORKER_ORIGIN below
      with its exact URL, e.g. https://run-planner-strava.your-subdomain.workers.dev
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://www.strava.com PASTE_YOUR_WORKER_ORIGIN; frame-src https://accounts.google.com; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="manifest" href="/run-planner/manifest.webmanifest" />
    <link rel="icon" href="/run-planner/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/run-planner/icon-180.png" />
    <title>Run Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
